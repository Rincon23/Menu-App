# Agente de métricas — roda no Servidor (ou em qualquer máquina além da que
# roda o menu). É o mesmo checador, respondendo GET /api/agent com a RAM, o
# disco e os containers DESTA máquina, e abrindo o terminal dela
# (/api/agent/terminal). O checador do Orange Pi fala com ele pelo Tailscale
# (SERVIDOR_AGENT_URL no .env do Pi).
#
#   docker compose -f docker-compose.agent.yml up -d --build
#
# Precisa de um arquivo .env ao lado com o MESMO AGENT_TOKEN do Orange Pi.
services:
  rincon-menu-agent:
    build: ./server
    container_name: rincon-menu-agent
    restart: unless-stopped
    ports:
      # Quem tem o token tem um shell nesta máquina. Pra só o Tailscale
      # enxergar a porta, prefixe o IP dele: "100.x.y.z:3002:3001".
      - "3002:3001"
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      # Usuário do terminal no host (vazio = root).
      - TERMINAL_USER=${TERMINAL_USER:-}
    volumes:
      # Métricas e terminal (container descartável com acesso ao host).
      - /var/run/docker.sock:/var/run/docker.sock
