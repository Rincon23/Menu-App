services:
  rincon-menu:
    build: .
    # Alternativa: buildar direto do GitHub, sem precisar clonar o repo
    # no servidor. Toda vez que rodar "docker compose up -d --build" ele
    # busca o código mais recente do branch main sozinho.
    #
    # build:
    #   context: https://github.com/SEU-USUARIO/rincon-menu.git#main
    container_name: rincon-menu
    restart: unless-stopped
    depends_on:
      - rincon-menu-checker
    ports:
      - "8092:80"
    # Se você já tem uma rede compartilhada com seu proxy reverso
    # (Nginx Proxy Manager, Traefik, etc), descomente as linhas abaixo
    # e remova o "ports" acima — o proxy fala com o container pela rede interna.
    # IMPORTANTE: descomente o bloco "networks" nos DOIS serviços (mantendo
    # "default" na lista), senão o Nginx perde contato com o checador.
    #
    # networks:
    #   - default
    #   - proxy

  # Checador de status: pinga cada serviço a partir do servidor (sem CORS,
  # enxerga o status HTTP real). O Nginx acima faz proxy de /api/ pra cá.
  # Não precisa expor porta no host — só o Nginx conversa com ele.
  rincon-menu-checker:
    build: ./server
    container_name: rincon-menu-checker
    restart: unless-stopped
    environment:
      # Só deixa checar hosts dentro desse sufixo (trava SSRF).
      - ALLOWED_HOST_SUFFIX=.rincon.dev.br
      # Métricas (RAM / disco / containers): esta máquina é a seção "orangepi"
      # do menu; as do Servidor vêm do agente dele (docker-compose.agent.yml)
      # pelo Tailscale. SERVIDOR_AGENT_URL e AGENT_TOKEN ficam no arquivo .env.
      - MACHINE_ID=orangepi
      - REMOTE_AGENTS=servidor=${SERVIDOR_AGENT_URL:-}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      # Hash da senha do login (no .env; crie com ./definir-senha.sh — a
      # senha em si não fica salva). Sem ele o login fica desligado.
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      # Chave do 2FA (no .env; gere com: node server/totp.js). Com ela o
      # login pede também o código do app autenticador.
      - ADMIN_TOTP_SECRET=${ADMIN_TOTP_SECRET:-}
      # Usuário do terminal no host (vazio = root).
      - TERMINAL_USER=${TERMINAL_USER:-}
      - DATA_DIR=/data
    volumes:
      # Estatísticas dos containers (RAM e disco) e o terminal, que cria um
      # container descartável com acesso ao host. É acesso total ao Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Ordem / links ocultos / links adicionados no modo edição.
      - rincon-menu-data:/data
    # networks:
    #   - default

volumes:
  rincon-menu-data:

