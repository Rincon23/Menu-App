server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API do checador de status (container rincon-menu-checker na rede do compose).
    # resolver 127.0.0.11 = DNS interno do Docker; usar variável no proxy_pass
    # força resolução em runtime (Nginx sobe mesmo se o checker ainda não subiu).
    # Host com a porta ($http_host): o checador compara com o Origin pra
    # recusar pedidos de outros sites.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $checker_upstream http://rincon-menu-checker:3001;
        proxy_pass $checker_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Terminal (WebSocket): precisa repassar o upgrade. O checador manda ping
    # a cada 30s, então o read_timeout não derruba sessão parada.
    location /api/terminal {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $checker_upstream http://rincon-menu-checker:3001;
        proxy_pass $checker_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache pesado pros assets com hash no nome (js/css gerados pelo build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
